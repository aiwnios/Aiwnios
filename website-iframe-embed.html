<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aiwnios - HolyC Compiler</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #1a1a1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #252525;
            padding: 1rem 2rem;
            border-bottom: 1px solid #333;
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 500;
        }

        header h1 span {
            color: #4ecdc4;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1rem;
        }

        .iframe-container {
            flex: 1;
            min-height: 500px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        footer {
            padding: 1rem 2rem;
            text-align: center;
            color: #666;
            font-size: 0.875rem;
        }

        footer a {
            color: #4ecdc4;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <header>
        <h1><span>Aiwnios</span> - HolyC Compiler/Runtime in Your Browser</h1>
    </header>

    <main>
        <div class="iframe-container">
            <!--
                Replace "aiwnios.html" with the path to your built WebAssembly file.
                After building with Emscripten, you'll have an aiwnios.html file.
            -->
            <iframe src="aiwnios.html" allowfullscreen></iframe>
        </div>
    </main>

    <footer>
        <p>Powered by <a href="https://github.com/nrootconauto/Aiwnios" target="_blank">Aiwnios</a> - A HolyC Compiler/Runtime</p>
    </footer>
</body>
</html>
